<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jotun App Redirect</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            if (/android/i.test(userAgent)) {
                // Nếu là Android, chuyển đến Google Play
                window.location.href = "https://play.google.com/store/apps/details?id=com.stoo.jotunAppp&pli=1";
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // Nếu là iOS, chuyển đến Apple Store
                window.location.href = "https://apps.apple.com/us/app/jotun-h%C3%A0nh-tr%C3%ACnh/id6479573057";
            } else {
                // Nếu không phải Android hoặc iOS, hiển thị thông báo
                document.getElementById("message").innerHTML = "Vui lòng mở trang này trên điện thoại để tải ứng dụng.";
            }
        });
    </script>
</head>
<body>
    <h2 id="message">Đang chuyển hướng...</h2>
</body>
</html>
